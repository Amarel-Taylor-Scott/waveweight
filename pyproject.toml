[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "waveweight"
version = "0.2.0"
description = "Discover sample-weight schemes that lift out-of-period transfer — index patterns AND data-driven local-window drivers x weight curves, validated on a held-out split against a magnitude-matched null. numpy-only."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Amarel Taylor Scott" }]
keywords = ["machine-learning", "sample-weighting", "time-series", "covariate-shift",
            "bootstrap", "feature-engineering", "kaggle", "tabular"]
dependencies = ["numpy>=1.21"]

[project.scripts]
waveweight = "waveweight.cli:main"

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["waveweight"]
